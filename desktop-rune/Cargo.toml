[package]
name = "threadkeeper"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tracker-core = { path = "../tracker-core" }
rune = { git = "https://github.com/anomalyco/rune", rev = "2bdfae16568782a56cb93818944d05b93546bce5", default-features = false, features = ["metal-backend", "accessibility", "svg", "native-file-dialog"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

libc = "0.2"
tokio = { version = "1", features = ["rt", "time", "net"] }
