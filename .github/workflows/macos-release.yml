name: macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version matching desktop-rune/Cargo.toml (e.g. 0.1.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python3 desktop-rune/scripts/release-version.py
      - name: Check existing tag points to this commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" || {
              echo "::error::Tag $TAG already points to another commit. Choose a new version."
              exit 1
            }
          fi
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Verify public defaults contain no team roster
        run: |
          python3 - <<'PY'
          import json
          assert not json.load(open('maintainers.json'))['maintainers']
          assert not json.load(open('tracker.config.json'))['repositories']
          PY
      - name: Test
        run: cargo test --workspace --locked
      - name: Build release
        run: cargo build --release --locked -p threadkeeper
      - name: Package app
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 desktop-rune/scripts/package.py --profile release --version "$RELEASE_VERSION" --build-number "$BUILD_NUMBER"
      - name: Ad-hoc sign preview and create ZIP
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          codesign --force --sign - desktop-rune/dist/Threadkeeper.app
          codesign --verify --deep --strict desktop-rune/dist/Threadkeeper.app
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent desktop-rune/dist/Threadkeeper.app "release-assets/Threadkeeper-macOS-${ARCH}.zip"
          cd release-assets
          shasum -a 256 "Threadkeeper-macOS-${ARCH}.zip" > "Threadkeeper-macOS-${ARCH}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cat > release-notes.md <<'NOTES'
          Download arm64 for Apple Silicon or x86_64 for Intel. Unzip and move Threadkeeper.app to Applications.

          These preview builds are ad-hoc signed, not Developer ID signed or notarized. macOS may block first launch. After verifying the source, use System Settings → Privacy & Security → Open Anyway. Do not disable Gatekeeper globally.

          Team rosters are distributed separately and can be imported through Settings. No team rosters or credentials are bundled in this release.
          NOTES
          # Tag exactly the commit tested by this run, never the moving main branch.
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --verify-tag --draft --title "Threadkeeper $TAG" --notes-file release-notes.md
          fi
