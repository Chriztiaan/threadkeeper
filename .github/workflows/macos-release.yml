name: macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Verify public defaults contain no team roster
        run: |
          python3 - <<'PY'
          import json
          assert not json.load(open('maintainers.json'))['maintainers']
          assert not json.load(open('tracker.config.json'))['repositories']
          PY
      - name: Test
        run: cargo test --workspace --locked
      - name: Build release
        run: cargo build --release --locked -p threadkeeper
      - name: Package app
        env:
          RELEASE_REF: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, tomllib
          version=tomllib.load(open('desktop-rune/Cargo.toml','rb'))['package']['version']
          ref=os.environ['RELEASE_REF']
          if ref.startswith('v'):
              if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',ref):
                  raise SystemExit('Release tags must be vMAJOR.MINOR.PATCH')
              if version!=ref[1:]:
                  raise SystemExit("Release tag must match desktop-rune/Cargo.toml version")
          subprocess.run(['python3','desktop-rune/scripts/package.py','--profile','release','--version',version,'--build-number',os.environ['BUILD_NUMBER']],check=True)
          PY
      - name: Ad-hoc sign preview and create ZIP
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          codesign --force --sign - desktop-rune/dist/Threadkeeper.app
          codesign --verify --deep --strict desktop-rune/dist/Threadkeeper.app
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent desktop-rune/dist/Threadkeeper.app "release-assets/Threadkeeper-macOS-${ARCH}.zip"
          cd release-assets
          shasum -a 256 "Threadkeeper-macOS-${ARCH}.zip" > "Threadkeeper-macOS-${ARCH}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          Download arm64 for Apple Silicon or x86_64 for Intel. Unzip and move Threadkeeper.app to Applications.

          These preview builds are ad-hoc signed, not Developer ID signed or notarized. macOS may block first launch. After verifying the source, use System Settings → Privacy & Security → Open Anyway. Do not disable Gatekeeper globally.

          Team rosters are distributed separately and can be imported through Settings. No team rosters or credentials are bundled in this release.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --verify-tag --draft --title "Threadkeeper $TAG" --notes-file release-notes.md
          fi
